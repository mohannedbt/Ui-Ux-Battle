<!DOCTYPE html>
<html>
<head>
  <title>Bug Hunt Challenge</title>
  <script src="https://unpkg.com/monaco-editor@0.43.0/min/vs/loader.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    #editor { height: 300px; border: 1px solid #ccc; margin-bottom: 10px; }
    textarea { width: 100%; height: 80px; margin-bottom: 10px; }
    #timer { font-size: 18px; font-weight: bold; color: red; }
  </style>
</head>
<body>

<h2>🪲 Bug Hunt: Fix the Bug!</h2>
<button>go back</button>
<div id="timer">⏳ Time left: <span id="countdown">05:00</span></div>

<div id="editor"></div>

<h3>Your Explanation:</h3>
<textarea id="explanation" placeholder="Explain what you fixed..."></textarea>

<button onclick="submitFix()" class="sub_button">✅ Submit Fix</button>

<script>
  let editor;
  require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.43.0/min/vs' }});
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor'), {
      value: `<h1>Welcome to Bug Hunt\n<p>This tag is not closed!`,
      language: 'html',
      theme: 'vs-dark',
      automaticLayout: true
    });
  });

  let time = 5 * 60;
  const countdownEl = document.getElementById("countdown");
  const timer = setInterval(() => {
    if (time <= 0) {
      clearInterval(timer);
      alert("⏰ Time's up! Submitting your last version.");
      submitFix();
      return;
    }
    const minutes = String(Math.floor(time / 60)).padStart(2, '0');
    const seconds = String(time % 60).padStart(2, '0');
    countdownEl.textContent = `${minutes}:${seconds}`;
    time--;
  }, 1000);

  function submitFix() {

    clearInterval(timer); // 🛑 Stop timer on submit

    const code = editor.getValue();
    const explanation = document.getElementById('explanation').value;

    if (!code.trim() || !explanation.trim()) {
      alert("Please fill in both the code and the explanation.");
      return;
    }

    const data = new FormData();
    data.append('code', code);
    data.append('explanation', explanation);

    fetch('submit.php', {
      method: 'POST',
      body: data
    })
    .then(res => res.text())
    .then(response => {
      alert("✅ " + response);
    })
    .catch(err => {
      console.error(err);
      alert("❌ Submission failed.");
    });
  }
</script>

</body>
</html>
